[project]
name = "premortemai"
version = "0.1.0"
description = "Premortem analysis agents"
readme = "README.md"
authors = [
    { name = "Dario Marcolin", email = "dario.marcolin16@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "jinja2>=3.1.6",
    "langchain>=1.4.6",
    "langchain-anthropic>=1.7.6",
    "langchain-core>=1.6.12",
    "langchain-google-genai>=4.4.3",
    "langchain-groq>=1.1.3",
    "langchain-mistralai>=1.1.6",
    "langchain-openai>=1.7.4",
    "langchain-tavily>=0.2.18",
    "langgraph>=1.2.16",
    "markdown-it-py>=3.0",
    "markitdown[all]>=0.1.8",
    "pydantic>=2.14.1",
    "python-dotenv>=1.2.4",
    "streamlit>=1.66.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "fpdf2>=2.8.9",
    "pytest>=9.1.1",
    "python-docx>=1.2.0",
]
